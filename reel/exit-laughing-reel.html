<script>
(() => {
  /* ============ EASY KNOBS ============ */

  /* 1. YOUR PHOTOS, in reel order (hosted in your exitlaughing GitHub repo, /reel folder).
        7 photos = the real View-Master way: each photo sits in two opposite windows, like a 3D pair.
        Up to 14 photos = one per window. Leave it empty [] to see the sample slides. */
  const BASE = 'https://cdn.jsdelivr.net/gh/mimikamiocreative/exitlaughing@cc9d4ade4bc99101c4496b80462e9a617ba9e404/reel/';
  const IMAGES = [
    BASE + 'photo-1.jpg',   // 1. picnic
    BASE + 'photo-2.jpg',   // 2. cake cutting
    BASE + 'photo-3.jpg',   // 3. peeking behind the perfume cabinet
    BASE + 'photo-4.jpg',   // 4. silhouettes and the lighter
    BASE + 'photo-5.jpg',   // 5. curls on the dressing table
    BASE + 'photo-6.jpg',   // 6. palm boulevard
    BASE + 'photo-7.jpg',   // 7. the sleeping feast
    BASE + 'photo-8.jpg',   // 8. the two women with red flowers
    BASE + 'photo-9.jpg',   // 9. red tulips
    BASE + 'photo-10.jpg',  // 10. laughing on the carpet
    BASE + 'photo-11.jpg',  // 11. Paramount gate
    BASE + 'photo-12.jpg',  // 12. the stage
    BASE + 'photo-13.jpg',  // 13. blue eyes at the drive-in
    BASE + 'photo-14.jpg',  // 14. red dress by the window
  ];
  /* Where the important bit of each photo is (0–1 across, 0–1 down), so it stays in view
     in the little windows and the big picture. Same order as above. */
  const FOCUS = [
    [0.45, 0.42], [0.42, 0.40], [0.38, 0.32], [0.55, 0.55], [0.50, 0.50], [0.62, 0.66], [0.50, 0.40],

  ];
  /* Optional little label for each photo (same order). Leave [] for none. */
  const CAPTIONS = [];
  const CAPTION_FONT = "'Courier New', Courier, monospace";

  /* 2. The reel: where it sits and how big */
  const REEL_SIZE = 0.62;     // across, as a share of the widget's shorter side (1 = fills it)
  const REEL_X = 0.80;        // centre of the reel: 0 = left edge, 1 = right edge
  const REEL_Y = 0.55;        // 0 = top edge, 1 = bottom edge (go past 1 to tuck it off the bottom)
  const SHADOW = 0.5;         // shadow under the reel (0 = none)

  /* 3. How it turns */
  const SCROLL_TURNS = true;  // mouse wheel / trackpad over the reel turns it one click at a time
  const AUTOPLAY = 0;         // seconds between slides on its own (0 = off)
  const SPRINGINESS = 0.55;   // how much it wobbles as it clicks into place (0 = none, 1 = lots)

  /* 4. The big picture behind */
  const TRANSITION = 'projector';  // 'projector' (dark flash, slide drops in, focus pulls), 'slide' (pushes sideways) or 'fade'
  const TRANSITION_SECONDS = 0.9;
  const WARMTH = 0.5;         // faded Kodachrome warmth (0 = untouched photo)
  const GRAIN = 0.10;         // film grain (0 = clean)
  const FLICKER = 0.5;        // projector-lamp flicker (0 = steady)
  const DRIFT = 0.04;         // slow push-in on the big picture (0 = still)

  /* ---- don't need to touch below here ---- */
  const $ = id => document.getElementById(id);
  const stage = $('stage'), wrap = $('reelWrap'), reel = $('reel'), disc = $('disc');
  const slides = [$('slideA'), $('slideB')], shade = $('shade'), grain = $('grain'), cap = $('caption');
  stage.style.setProperty('--cap-font', CAPTION_FONT);

  // reel geometry, measured off the reel artwork (740 x 740 units, centre 370,370)
  const C = 370, RING = 265.6, FIRST = 14.26, STEP = 360 / 14, NWIN = 14;
  const theta = k => FIRST + k * STEP;
  const wrapDeg = a => ((a % 360) + 540) % 360 - 180;

  /* ---------- sample slides if no photos yet ---------- */
  function sampleSlides(){
    const pal = [
      ['#F2B880','#E9724C','#3F6C51','#24453A','#FFF3D6'], ['#9ED2E6','#F7E3AF','#4C8C8A','#1F4E5F','#FFF6E0'],
      ['#F6C6A8','#C9594A','#7A4E3A','#3B2620','#FBEAD0'], ['#BFD8C2','#E8C66A','#5E7F4C','#2F4A2B','#FDF2D8'],
      ['#F4D35E','#EE964B','#B2533E','#5B2A1E','#FFF4D0'], ['#C7B8E8','#F0A6A0','#6F5E8C','#352B4A','#FBEFE2'],
      ['#A8D5BA','#F2E3BC','#C76B4C','#3D5A4A','#FFF7E3']];
    const words = ['Bonjour!','Smile, Nina','Sunday Best','Exit Laughing','Curtain Up','Hold Still','The End'];
    return pal.map((p, i) => {
      const c = document.createElement('canvas'); c.width = 1600; c.height = 1000; const g = c.getContext('2d');
      const sky = g.createLinearGradient(0, 0, 0, 1000); sky.addColorStop(0, p[0]); sky.addColorStop(.62, p[1]); g.fillStyle = sky; g.fillRect(0, 0, 1600, 1000);
      g.fillStyle = p[4]; g.globalAlpha = .9; g.beginPath(); g.arc(1150 - i * 90, 330, 120, 0, 7); g.fill(); g.globalAlpha = 1;
      [[p[2], 640, 260], [p[3], 760, 180]].forEach(([col, base, amp], j) => {
        g.fillStyle = col; g.beginPath(); g.moveTo(0, 1000);
        for (let x = 0; x <= 1600; x += 20) g.lineTo(x, base + Math.sin(x / (240 + j * 90) + i * 1.7) * amp * .35 + Math.sin(x / 90 + i) * 12);
        g.lineTo(1600, 1000); g.fill();
      });
      g.fillStyle = p[4]; g.textAlign = 'center';
      g.font = 'italic 700 150px Georgia, serif'; g.fillText(words[i], 800, 520);
      g.font = '600 38px "Courier New", monospace'; g.fillText('VIEW No. ' + (i + 1), 800, 600);
      return c.toDataURL('image/jpeg', .85);
    });
  }
  const PICS = IMAGES.length ? IMAGES.slice(0, 14) : sampleSlides();
  const N = PICS.length;
  const pairs = N <= 7;
  const picFor = k => pairs ? (k % 7) % N : k % N;   // which photo sits in window k
  // where to place a photo so its focus point stays in view when it's cropped to a box
  const sizes = [];
  const pos = (i, bw, bh) => {
    const sz = sizes[i], f = (IMAGES.length && FOCUS[i]) || [.5, .5];
    if (!sz) return `${f[0] * 100}% ${f[1] * 100}%`;
    const s = Math.max(bw / sz[0], bh / sz[1]), vw = bw / (sz[0] * s), vh = bh / (sz[1] * s);
    const p = (c, v) => v >= 1 ? 50 : Math.max(0, Math.min(100, (c - v / 2) / (1 - v) * 100));
    return `${p(f[0], vw).toFixed(1)}% ${p(f[1], vh).toFixed(1)}%`;
  };
  PICS.forEach((src, i) => { const im = new Image();   // preload, and learn each photo's shape
    im.onload = () => { sizes[i] = [im.naturalWidth, im.naturalHeight]; placeAll(); }; im.src = src; });
  function placeAll(){
    wins.forEach((w, k) => w.style.backgroundPosition = pos(picFor(k), 102, 110));
    slides.forEach(sl => { if (sl.dataset.pic) sl.style.backgroundPosition = pos(+sl.dataset.pic, W, H); });
  }

  /* ---------- build the windows ---------- */
  const wins = [];
  for (let k = 0; k < NWIN; k++){
    const w = document.createElement('div'); w.className = 'win';
    const a = theta(k) * Math.PI / 180;
    w.style.left = (C + RING * Math.sin(a)) + 'px'; w.style.top = (C - RING * Math.cos(a)) + 'px';
    w.style.transform = `rotate(${theta(k)}deg)`;     // the top of each photo faces outwards
    w.style.backgroundImage = `url("${PICS[picFor(k)]}")`;
    w.setAttribute('role', 'option'); w.setAttribute('aria-label', 'Photo ' + (picFor(k) + 1));
    reel.insertBefore(w, disc); wins.push(w);
  }

  /* ---------- grain + grade ---------- */
  (() => {
    const c = document.createElement('canvas'); c.width = c.height = 220; const g = c.getContext('2d'), d = g.createImageData(220, 220);
    for (let i = 0; i < d.data.length; i += 4){ const v = 128 + (Math.random() - .5) * 255; d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 255; }
    g.putImageData(d, 0, 0); grain.style.backgroundImage = `url(${c.toDataURL()})`; grain.style.opacity = Math.min(1, GRAIN * 2);
  })();
  const grade = `sepia(${.35 * WARMTH}) saturate(${1 + .1 * WARMTH}) contrast(${1 + .06 * WARMTH}) brightness(${1 - .03 * WARMTH})`;
  slides.forEach(s => s.style.filter = grade);

  /* ---------- layout ---------- */
  let W = 1, H = 1, S = 1, CX = 0, CY = 0;
  function layout(){
    W = stage.clientWidth; H = stage.clientHeight;
    S = REEL_SIZE * Math.min(W, H) / 740; CX = REEL_X * W; CY = REEL_Y * H;
    wrap.style.transform = `translate(${CX - C * S}px, ${CY - C * S}px) scale(${S})`;
    if (wins.length) placeAll();
  }

  /* ---------- the big picture ---------- */
  let front = 0, shownPic = -1, driftStart = performance.now();
  function show(i, instant){
    if (i === shownPic) return; shownPic = i;
    const T = TRANSITION_SECONDS * 1000, ease = 'cubic-bezier(.2,.7,.2,1)';
    const oldS = slides[front], newS = slides[1 - front]; front = 1 - front;
    newS.style.backgroundImage = `url("${PICS[i]}")`; newS.dataset.pic = i;
    newS.style.backgroundPosition = pos(i, W, H);
    newS.style.zIndex = 2; oldS.style.zIndex = 1;
    cap.textContent = CAPTIONS[i] || ''; cap.style.opacity = CAPTIONS[i] ? 1 : 0;
    [newS, oldS].forEach(s => s.getAnimations().forEach(a => a.cancel()));
    newS.style.transform = 'none'; oldS.style.transform = oldS.style.transform || 'none';

      [newS, oldS].forEach(s => s.getAnimations().forEach(a => a.cancel()));
      newS.style.opacity = 1; oldS.style.opacity = 0; oldS.style.transform = 'none'; driftStart = performance.now();
    };
    if (instant) return done();
    let anim;
    if (TRANSITION === 'fade'){
      newS.style.opacity = 1;
      anim = newS.animate([{opacity: 0}, {opacity: 1}], {duration: T, easing: 'ease-in-out', fill: 'forwards'});
    } else if (TRANSITION === 'slide'){
      newS.style.opacity = 1;
      oldS.animate([{transform: oldS.style.transform, filter: grade}, {transform: 'translateX(-35%)', filter: grade + ' brightness(.45)'}],

      oldS.animate([{opacity: 1}, {opacity: 1, offset: .99}, {opacity: 0}], {duration: dark, fill: 'forwards'});
      newS.style.opacity = 1;
      anim = newS.animate([
        {opacity: 0, transform: 'translateY(-3.5%) scale(1.02)', filter: grade + ' blur(9px) brightness(1.3)'},
        {opacity: 0, offset: .3},
        {opacity: 1, transform: 'translateY(.6%) scale(1.02)', filter: grade + ' blur(7px) brightness(1.35)', offset: .42},
        {transform: 'translateY(-.25%) scale(1.01)', offset: .52},
        {transform: 'translateY(0) scale(1)', filter: grade + ' blur(2px) brightness(1.08)', offset: .7},
        {opacity: 1, transform: 'translateY(0) scale(1)', filter: grade}],
        {duration: T * 1.4, easing: 'ease-out', fill: 'forwards'});
    }
    anim.onfinish = done;
  }

  /* ---------- turning the reel ---------- */
  let R = 0, V = 0, target = 0, sel = 0, dragging = false, hover = -1;
  const k2 = 140, damp = lerpN(30, 11, SPRINGINESS);
  function lerpN(a, b, t){ return a + (b - a) * t; }
  function select(k, instant){
    k = ((k % NWIN) + NWIN) % NWIN; sel = k;
    target = -theta(k) + 360 * Math.round((R + theta(k)) / 360);   // nearest way round
    if (instant){ R = target; V = 0; }
    show(picFor(k), instant);
    wins.forEach((w, j) => w.setAttribute('aria-selected', j === k));
    restartAuto();
  }
  const step = d => select(sel + d);

  // measure the reel where it really is on screen (Readymag may scale or zoom the page)
  const geo = () => { const r = wrap.getBoundingClientRect(); return {x: r.left + r.width / 2, y: r.top + r.height / 2, s: r.width / 740 || 1}; };
  const polar = (cx, cy) => { const g = geo(), dx = (cx - g.x) / g.s, dy = (cy - g.y) / g.s;
    return {r: Math.hypot(dx, dy), a: Math.atan2(dx, -dy) * 180 / Math.PI}; };
  // which window is under the pointer (or -1)
  function winAt(cx, cy, target){
    const w = target && target.closest && target.closest('.win');
    if (w) return wins.indexOf(w);
    const p = polar(cx, cy); if (p.r < 205 || p.r > 325) return -1;
    const a = p.a - R, k = Math.round(wrapDeg(a - FIRST) / STEP);
    return Math.abs(wrapDeg(a - theta(k))) < 12 ? ((k % NWIN) + NWIN) % NWIN : -1;
  }
  const onDisc = (cx, cy) => polar(cx, cy).r < 368;
  const angAt = (cx, cy) => polar(cx, cy).a;

  let down = null, justDragged = false;
  stage.addEventListener('pointerdown', ev => {
    if (!onDisc(ev.clientX, ev.clientY)) return;
    down = {x: ev.clientX, y: ev.clientY, a: angAt(ev.clientX, ev.clientY), R, t: performance.now(), moved: false, w: 0, id: ev.pointerId};
  });
  stage.addEventListener('pointermove', ev => {
    if (down){
      if (!down.moved && Math.hypot(ev.clientX - down.x, ev.clientY - down.y) > 8){
        down.moved = true; dragging = true; wrap.classList.add('dragging');
        try { stage.setPointerCapture(down.id); } catch (e) {}
      }
      if (down.moved){
        const a = angAt(ev.clientX, ev.clientY), now = performance.now();
        const nr = down.R + wrapDeg(a - down.a), dt = Math.max(8, now - down.t) / 1000;
        down.w = lerpN(down.w, (nr - R) / dt, .35); R = nr; target = nr; V = 0; down.t = now;
      }
      return;
    }
    hover = winAt(ev.clientX, ev.clientY, ev.target);
    wrap.classList.toggle('overWin', hover >= 0);
  });
  const release = ev => {
    if (!down) return;
    if (down.moved){
      // let it coast a little, then click into the nearest window
      const end = R + Math.max(-400, Math.min(400, down.w)) * .3;
      const k = Math.round(wrapDeg(-end - FIRST) / STEP);
      V = down.w * .5; select(k); justDragged = true; setTimeout(() => justDragged = false, 50);
    }
    down = null; dragging = false; wrap.classList.remove('dragging');
  };
  stage.addEventListener('pointerup', release); stage.addEventListener('pointercancel', release);
  stage.addEventListener('pointerleave', () => { if (!down){ hover = -1; wrap.classList.remove('overWin'); } });
  // a plain click on a window picks it
  stage.addEventListener('click', ev => {
    if (justDragged) return;
    const k = winAt(ev.clientX, ev.clientY, ev.target); if (k >= 0) select(k);
  });

  let wheelAcc = 0, wheelT = 0;
  if (SCROLL_TURNS) stage.addEventListener('wheel', ev => {
    if (!onDisc(ev.clientX, ev.clientY)) return;
    ev.preventDefault();
    const d = (Math.abs(ev.deltaY) > Math.abs(ev.deltaX) ? ev.deltaY : ev.deltaX) * (ev.deltaMode === 1 ? 40 : 1);
    wheelAcc += d; const now = performance.now();
    if (Math.abs(wheelAcc) > 40 && now - wheelT > 160){ step(wheelAcc > 0 ? 1 : -1); wheelAcc = 0; wheelT = now; }
  }, {passive: false});
  window.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowRight' || ev.key === 'ArrowDown') { step(1); ev.preventDefault(); }
    if (ev.key === 'ArrowLeft' || ev.key === 'ArrowUp') { step(-1); ev.preventDefault(); }
  });
  let autoTimer = null;
  function restartAuto(){ if (!AUTOPLAY) return; clearTimeout(autoTimer); autoTimer = setTimeout(() => step(1), AUTOPLAY * 1000); }

  /* ---------- loop ---------- */
  let last = performance.now(), frameNo = 0;
  const lit = new Float32Array(NWIN).fill(-1);
  function frame(now){
    const dt = Math.min(.04, (now - last) / 1000); last = now; frameNo++;
    if (!dragging){ const a = k2 * (target - R) - damp * V; V += a * dt; R += V * dt; if (Math.abs(target - R) < .01 && Math.abs(V) < .05){ R = target; V = 0; } }
    reel.style.transform = `rotate(${R}deg)`;
    // the window at the top is lit by the lamp; the rest are dimmer film
    for (let k = 0; k < NWIN; k++){
      const a = wrapDeg(theta(k) + R), l = Math.exp(-((a / 20) ** 2)) + (k === hover ? .35 : 0);
      if (Math.abs(l - lit[k]) > .01){ lit[k] = l;
        wins[k].style.filter = `brightness(${(.74 + .4 * l).toFixed(3)}) saturate(${(.75 + .35 * l).toFixed(3)}) sepia(${(.25 * (1 - Math.min(1, l))).toFixed(3)})`; }
    }
    // film grain jumps every other frame; the lamp flickers a touch
    if (GRAIN > 0 && frameNo % 2 === 0) grain.style.backgroundPosition = `${(Math.random() * 220) | 0}px ${(Math.random() * 220) | 0}px`;
    if (FLICKER > 0 && !shade.getAnimations().length) shade.style.opacity = (FLICKER * (Math.random() * .035 + (Math.random() < .02 ? .06 : 0))).toFixed(3);
    if (DRIFT > 0){ const t = Math.min(1, (now - driftStart) / 14000), s = slides[front];
      if (!s.getAnimations().length) s.style.transform = `scale(${(1 + DRIFT * (1 - Math.pow(1 - t, 2))).toFixed(4)})`; }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', layout); layout();
  select(0, true);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
